# Local development overrides
# Auto-loaded when running: docker-compose up

services:
  open-webui:
    ports:
      - "3000:8080"  # Access at http://localhost:3000
    environment:
      WEBUI_BASE_URL: http://localhost:3000
      WEBUI_URL: http://localhost:3000
      WEBUI_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOW_ORIGINS: http://localhost:3000
      WEBUI_SESSION_COOKIE_SECURE: "false"
      WEBUI_AUTH_COOKIE_SECURE: "false"
      MCP_SERVER_URL: "http://mcp-server:8090/mcp"

  neo4j:
    image: neo4j:latest
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password123

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      # Mount app dir so code changes take effect after restart (no rebuild)
      - ./mcp-server:/app/code
    working_dir: /app/code
    environment:
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8090"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      PYTHONPATH: /app/code
    command: ["python", "-u", "/app/code/server.py"]
    depends_on:
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8090' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    ports:
      - "8000:8000"
    environment:
      MCPO_API_KEY: ${MCPO_API_KEY:-dev-api-key}
    command:
      - "--port"
      - "8000"
      - "--api-key"
      - "${MCPO_API_KEY:-dev-api-key}"
      - "--server-type"
      - "streamable-http"
      - "--"
      - "http://mcp-server:8090/mcp"
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: on-failure