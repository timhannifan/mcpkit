[project]
name = "openweb"
version = "0.1.0"
description = "OpenWebUI deployment setup with MCP server for EC2"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    # by default, ruff enables all F and a subset of E rules
    # for a description of rulesets and examples, see:
    # https://docs.astral.sh/ruff/rules/
    "B",      # bugbear - identifies likely bugs
    "C4",     # flake8-comprehensions - identifies redundant calls in comprehensions
    "I",      # isort
    "N801",   # pep8-naming - enforce ClassNamesStyle
    "N804",   # pep8-naming - first arg of classmethod should be cls
    "N805",   # pep8-naming - first arg of method should be self
    "PTH",    # prefer pathlib over os.path as seems to be the consensus
    "Q",      # flake8-quotes - double quotes preferred (like black)
    "S",      # flake8-bandit - security checks
    "UP",     # pyupgrade - requires preferred syntax in newer python versions
    "YTT",    # flake8-2020 - corrects code that doesn't anticipate 2 digit python minor version
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "A",      # flake8-builtins
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]

ignore = [
    "ISC001",  # Conflicts with formatter
    "S104",    # Binding to all interfaces - intentional for Docker
    "S110",    # try-except-pass - acceptable for graceful degradation
    "B905",    # won't work on python <3.10
    "N805",    # First argument of a method should be named `self` - false positive for class methods
    "S101",    # Use of `assert`
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["mcp_server"]
