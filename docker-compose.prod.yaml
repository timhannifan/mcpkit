# Production overrides
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

services:
  neo4j:
    image: neo4j:latest
    ports:
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}

  open-webui:
    expose:
      - "8080"  # Internal only, accessed via Caddy
    environment:
      WEBUI_BASE_URL: ${WEBUI_BASE_URL:-http://localhost}
      WEBUI_URL: ${WEBUI_URL:-http://localhost}
      WEBUI_CSRF_TRUSTED_ORIGINS: ${WEBUI_CSRF_TRUSTED_ORIGINS:-http://localhost}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
      WEBUI_SESSION_COOKIE_SECURE: "false"
      WEBUI_AUTH_COOKIE_SECURE: "false"
      MCP_SERVER_URL: "http://mcp-server:8090/mcp"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8090"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
    depends_on:
      neo4j:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8090' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    ports:
      - "8000:8000"
    environment:
      MCPO_API_KEY: ${MCPO_API_KEY:-dev-api-key}
    command:
      - "--port"
      - "8000"
      - "--api-key"
      - "${MCPO_API_KEY:-dev-api-key}"
      - "--server-type"
      - "streamable-http"
      - "--"
      - "http://mcp-server:8090/mcp"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: on-failure

  webserver:
    build:
      context: ./webserver
      dockerfile: Caddy.Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./caddy_data:/data
      - ./caddy_data:/config
      - ./webserver/Caddyfile:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
    depends_on:
      - open-webui
      - mcp-server